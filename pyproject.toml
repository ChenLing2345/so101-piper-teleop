[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "so101-piper-teleop"
version = "0.1.0"
description = "Local SO-101 leader to AgileX PiPER teleoperation over USB serial and SocketCAN"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["robotics", "teleoperation", "so101", "piper", "socketcan", "lerobot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
leader = ["lerobot[feetech]==0.4.3"]
test = ["pytest>=8,<9", "build>=1,<2"]

[project.scripts]
piper-teleop = "piper_local.bridge:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.urls]
Homepage = "https://github.com/ChenLing2345/so101-piper-teleop"
Repository = "https://github.com/ChenLing2345/so101-piper-teleop"
Issues = "https://github.com/ChenLing2345/so101-piper-teleop/issues"
